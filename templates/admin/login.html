<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECS V3 Admin Login</title><link rel="stylesheet" href="{{url_for('static',filename='css/admin.css')}}"></head><body class="login-page"><form class="login-card" method="post"><small>ECS MULTISITE FLASK</small><h1>Website Platform</h1><p>Sign in to manage client websites.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}<label>Username<input name="username" required autofocus></label><label>Password<input type="password" name="password" required></label><button class="btn full">Sign in</button><p class="hint">Local default: admin / change-me-now. Set secure environment variables on Render.</p></form></body></html>
